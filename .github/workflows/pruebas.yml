# Runs on every pull request and on main: the generated pages must match their sources, and the site must
# pass the smoke tests in a real browser.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Las páginas generadas están al día
        run: npm run build && git diff --exit-code
      - name: Pruebas del sitio
        run: npm test
